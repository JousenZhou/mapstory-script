[project]
name = "ok-script-app"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# PySide6-Fluent-Widgets declares the full PySide6 metapackage, but the Qt app
# uses only modules from Essentials. The compiled Qt lock is installed with
# --no-deps, so remove generated pyside6 and pyside6-addons entries after
# recompiling while retaining pyside6-essentials.
qt = [
    "ok-script[adb,default,ocr,qt]==2.0.0b7",
    "openvino",
    "opencv-python",
]
web = [
    "ok-script[adb,default,ocr,web]==2.0.0b7",
    "openvino",
    "opencv-python",
]
docs = [
    "mkdocs==1.6.1",
]
# Optional: NVIDIA GPU template-matching acceleration used by MapleIdleTask.
# The task falls back to CPU automatically when this extra is not installed.
gpu = [
    "cupy-cuda12x[ctk]",
]
# Optional: ONNX Runtime CUDA inference used by LieDetectorTab (测谎检验).
# onnxruntime-gpu 1.23.x is the CUDA 12 generation (1.29+ requires CUDA 13);
# NVIDIA pip wheels supply cuBLAS/cuFFT/cuDNN runtimes on machines without a
# system CUDA Toolkit. The tab disables itself when this extra is missing.
inference = [
    "onnxruntime-gpu==1.23.2",
    "scipy>=1.14",
    "nvidia-cudnn-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-nvjitlink-cu12",
]
# Optional: ultralytics YOLO detection accelerated on NVIDIA GPU, used by
# Globals.detect (src/globals.py). torch must be a CUDA build matching the GPU
# generation; for Blackwell (RTX 50xx, sm_120) install from the cu128 index:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
#   pip install ultralytics
# Globals.detect falls back to CPU / disables itself when this extra is missing.
yolo = [
    "torch",
    "torchvision",
    "ultralytics>=8.4",
]
# Optional: the LieDetector (解测谎) GPU pipeline -- dense optical flow plus the
# particle filter -- reuses torch CUDA (src/liedetector/torch_flow.py,
# torch_array.py, tensor_evidence.py). It needs torch only, NOT torchvision:
# the Farneback-equivalent flow is implemented with plain tensor operators, so
# no pretrained weights are downloaded. Same CUDA-build caveat as `yolo` above;
# for Blackwell (RTX 50xx, sm_120) install from the cu128 index:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Without it the detector falls back to the CPU path (cv2 DIS flow + numpy
# scoring), which is also what the packaged exe uses since build_exe.spec
# excludes torch.
liegpu = [
    "torch",
]
