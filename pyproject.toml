[project]
name = "ok-script-app"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# PySide6-Fluent-Widgets declares the full PySide6 metapackage, but the Qt app
# uses only modules from Essentials. The compiled Qt lock is installed with
# --no-deps, so remove generated pyside6 and pyside6-addons entries after
# recompiling while retaining pyside6-essentials.
qt = [
    "ok-script[adb,default,ocr,qt]==2.0.0b7",
    "openvino",
    "opencv-python",
]
web = [
    "ok-script[adb,default,ocr,web]==2.0.0b7",
    "openvino",
    "opencv-python",
]
docs = [
    "mkdocs==1.6.1",
]
# Optional: NVIDIA GPU template-matching acceleration used by MapleIdleTask.
# The task falls back to CPU automatically when this extra is not installed.
gpu = [
    "cupy-cuda12x[ctk]",
]
# Optional: the lie-detector vision pipeline (src/liedetector/vision) -- ultralytics YOLO
# detection + built-in OC-SORT tracking, default GPU · TensorRT INT8 with a
# torch CUDA / CPU fallback chain. tensorrt/onnx/onnxslim power the local INT8
# engine build; engines and calibration images are rebuilt per machine and never
# shipped. torch must be a CUDA build matching the GPU generation; for Blackwell
# (RTX 50xx, sm_120) install from the cu128 index:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# Without this extra the detector falls back to the CPU path.
inference = [
    "ultralytics>=8.4",
    "tensorrt",
    "onnx",
    "onnxslim",
]
# Optional: ultralytics YOLO detection accelerated on NVIDIA GPU, used by
# Globals.detect (src/globals.py). torch must be a CUDA build matching the GPU
# generation; for Blackwell (RTX 50xx, sm_120) install from the cu128 index:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
#   pip install ultralytics
# Globals.detect falls back to CPU / disables itself when this extra is missing.
yolo = [
    "torch",
    "torchvision",
    "ultralytics>=8.4",
]
# Optional: torch CUDA backend for the lie-detector vision pipeline (src/liedetector/vision/detector.py)
# -- the fallback used when no cached TensorRT INT8 engine exists. It needs torch
# only, NOT tensorrt: the torch path runs the plain ultralytics YOLO weights on the
# GPU. Same CUDA-build caveat as `yolo` above; for Blackwell (RTX 50xx, sm_120)
# install from the cu128 index:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Without it the detector falls back to the CPU path, which is also what the
# packaged exe uses since build_exe.spec excludes torch.
liegpu = [
    "torch",
]
